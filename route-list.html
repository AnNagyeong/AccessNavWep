<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경로 목록</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #fff; }
    .route-list-page { min-height: 100vh; background: #fff; color: #222; padding: 0 28px 90px; }
    .route-list-header { height: 64px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #dadada; }
    .route-list-back { width: 40px; height: 40px; border: 0; background: transparent; color: #222; font-size: 28px; cursor: pointer; }
    .route-list-header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .route-list-summary { margin: 18px 0 12px; font-size: 13px; font-weight: 700; }
    .route-options { display: grid; gap: 10px; max-width: 720px; }
    .route-option {
      display: grid; grid-template-columns: 6px 1fr; gap: 12px; align-items: center;
      min-height: 76px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; padding: 14px;
    }
    .route-option-bar { width: 6px; height: 48px; background: #49d11a; }
    .route-option.danger .route-option-bar { background: #f26a6a; }
    .route-option h2 { margin: 0 0 6px; font-size: 14px; }
    .route-option p { margin: 0; color: #777; font-size: 12px; line-height: 1.45; }
    .route-start-fixed {
      position: fixed; left: 28px; right: 28px; bottom: 22px; max-width: 720px; height: 54px;
      border: 0; border-radius: 8px; background: #49d11a; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    @media (min-width: 1024px) {
      .route-list-page { width: min(1120px, calc(100vw - 96px)); margin: 0 auto; padding-top: 28px; }
      .route-start-fixed { left: calc((100vw - min(1120px, calc(100vw - 96px))) / 2 + 28px); right: auto; width: 320px; }
    }
  </style>
</head>
<body>
  <main class="route-list-page">
    <header class="route-list-header">
      <button class="route-list-back" type="button" aria-label="뒤로가기" onclick="history.back()">←</button>
      <h1>경로 목록</h1>
    </header>

    <p class="route-list-summary" id="routeSummary">추천 경로 2개</p>

    <section class="route-options" aria-label="추천 경로">
      <article class="route-option">
        <div class="route-option-bar" aria-hidden="true"></div>
        <div>
          <h2 id="safeRouteTitle">추천 경로</h2>
          <p>3분 · 100m · 안전 구간 20%, 주의 구간 80%</p>
        </div>
      </article>
      <article class="route-option danger">
        <div class="route-option-bar" aria-hidden="true"></div>
        <div>
          <h2 id="shortRouteTitle">최단 경로</h2>
          <p>2분 · 90m · 위험 구간 2곳 포함</p>
        </div>
      </article>
    </section>

    <button class="route-start-fixed" type="button" id="startGuidanceBtn">안내 시작</button>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const destination = params.get("name") || "목적지";
    document.getElementById("routeSummary").textContent = `${destination}까지 추천 경로 2개`;
    document.getElementById("safeRouteTitle").textContent = `${destination} 정문 경로`;
    document.getElementById("shortRouteTitle").textContent = `${destination} 최단 경로`;
    document.getElementById("startGuidanceBtn").addEventListener("click", () => {
      location.href = `guidance.html?${params.toString()}`;
    });
  </script>
</body>
</html>
