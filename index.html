<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessNav Web</title>
  <link rel="stylesheet" href="style.css?v=20260830-weather-cloud" />
</head>
<body>
  <div class="phone">
    <div id="map"></div>

    <!-- 검색창 -->
    <div class="search-bar">
      <button class="icon-btn" id="backBtn">←</button>
      <input
        type="text"
        id="searchInput"
        placeholder="장소를 검색하세요"
      />
      <button class="icon-btn" id="searchBtn">⌕</button>
    </div>

    <!-- 카테고리 칩 -->
    <div class="chips">
      <button class="chip" data-keyword="택시 정류장">🚕 택시 정류장</button>
      <button class="chip" data-keyword="편의점">🏪 편의점</button>
      <button class="chip" data-keyword="카페">☕ 카페</button>
      <button class="chip" data-keyword="음식점">🍽 음식점</button>
      <button class="chip" data-keyword="병원">🏥 병원</button>
      <span class="chip-line-break" aria-hidden="true"></span>
      <button class="chip" data-keyword="편의시설">♿ 편의시설</button>
    </div>

    <div id="weatherBadge" class="weather-badge hidden" aria-live="polite">
      <span class="weather-icon" aria-hidden="true"></span>
      <div>
        <strong id="weatherTemp">--°</strong>
        <span id="weatherSummary"></span>
      </div>
    </div>

    <!-- 검색 결과 -->
    <div id="resultList" class="result-list hidden"></div>
    
    <!-- 필터링 UI, 즐겨찾기, 현재 위치 가져오는 기능 -->
    <div class="map-control-buttons">
    <button id="favoriteBtn" class="map-control-btn">⭐</button>
    <button id="filterBtn" class="map-control-btn">⚙️</button>
    <button id="currentLocationBtn" class="map-control-btn">📍</button>
    </div>

    <!-- 필터 패널 -->
    <div id="filterPanel" class="filter-panel hidden">
  <div class="filter-map-preview"></div>

  <aside class="filter-sheet">
    <div class="filter-header">
      <h2>옵션 필터</h2>
      <button type="button" id="closeFilterBtn" class="filter-close-btn">×</button>
    </div>

    <div class="filter-options">
      <label class="filter-option">
        <span>장애인 화장실</span>
        <input type="checkbox" data-filter="disabled_toilet" />
        <span class="toggle-ui"></span>
      </label>

      <label class="filter-option">
        <span>배리어프리 매장</span>
        <input type="checkbox" data-filter="barrier_free_kiosk" />
        <span class="toggle-ui"></span>
      </label>

      <label class="filter-option">
        <span>엘리베이터</span>
        <input type="checkbox" data-filter="elevator" />
        <span class="toggle-ui"></span>
      </label>

      <label class="filter-option">
        <span>장애인 전용 주차장</span>
        <input type="checkbox" data-filter="disabled_parking" />
        <span class="toggle-ui"></span>
      </label>

      <label class="filter-option">
        <span>버스 정류장</span>
        <input type="checkbox" data-filter="bus_stop" />
        <span class="toggle-ui"></span>
      </label>
    </div>
  </aside>
</div>

    <!-- 하단 장소 시트 -->
    <div id="placeSheet" class="bottom-sheet expanded hidden">
  <div class="sheet-handle" id="sheetHandle"></div>

  <div class="sheet-content" id="panelContent">
    <p class="sheet-label">선택한 목적지</p>
    <h3 id="placeName">장소명</h3>
    <p id="placeAddress" class="muted">주소가 여기에 표시됩니다.</p>

    <div class="info-cards">
      <div class="info-card">
        <strong>3분</strong>
        <span>예상 시간</span>
      </div>
      <div class="info-card">
        <strong>100m</strong>
        <span>거리</span>
      </div>
      <div class="info-card danger">
        <strong>2곳</strong>
        <span>위험 구간</span>
      </div>
    </div>

    <div class="safety-bar">
      <div class="safe"></div>
      <div class="warn"></div>
    </div>

    <div class="safety-labels">
      <span>안전 20%</span>
      <span>주의 80%</span>
    </div>

    <div class="sheet-actions">
      <button class="secondary-btn" id="routeListBtn">경로 목록</button>
      <button class="primary-btn" id="startRouteBtn">안내 시작</button>
    </div>

  </div>
</div>

    <section id="favoritesPanel" class="favorites-screen favorites-panel hidden" aria-label="즐겨찾기">
      <header class="favorites-header">
        <button class="favorites-back-button" id="closeFavoritesPanelBtn" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5 8 12l7 7" />
          </svg>
        </button>
        <div>
          <h1>즐겨찾기</h1>
          <p>자주 찾는 장소 그룹을 관리하세요.</p>
        </div>
        <button class="favorites-edit-button" type="button">편집</button>
      </header>

      <section class="favorites-overview" aria-label="즐겨찾기 요약">
        <div class="overview-item">
          <span>그룹</span>
          <strong>3</strong>
        </div>
        <div class="overview-item">
          <span>등록순</span>
          <strong>최신</strong>
        </div>
      </section>

      <div class="favorites-content">
        <section class="favorite-list" aria-label="즐겨찾기 그룹 목록">
          <article class="favorite-group">
            <span class="favorite-star green" aria-hidden="true">★</span>
            <div class="favorite-info">
              <h2>기본 그룹</h2>
              <p>6 · 나만 보기</p>
            </div>
            <button class="group-menu-button" type="button" aria-label="기본 그룹 메뉴">⋮</button>
          </article>

          <article class="favorite-group">
            <span class="favorite-star purple" aria-hidden="true">★</span>
            <div class="favorite-info">
              <h2>남냠</h2>
              <p>12 · 공개</p>
            </div>
            <button class="group-menu-button" type="button" aria-label="남냠 메뉴">⋮</button>
          </article>

          <article class="favorite-group">
            <span class="favorite-star yellow" aria-hidden="true">★</span>
            <div class="favorite-info">
              <h2>경치 좋은 카페</h2>
              <p>5 · 나만 보기</p>
            </div>
            <button class="group-menu-button" type="button" aria-label="경치 좋은 카페 메뉴">⋮</button>
          </article>
        </section>
      </div>

      <button class="add-group-button" type="button">
        <span aria-hidden="true">+</span>
        새 그룹 추가
      </button>
    </section>

    <!-- 하단 네비 -->
    <nav class="bottom-nav" aria-label="하단 내비게이션">
      <button class="nav-item active" type="button" aria-label="홈">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M5.5 10.5V21h13V10.5" />
        </svg>
      </button>
      <button class="nav-item" type="button" aria-label="주변 장소">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s6-5.3 6-11a6 6 0 0 0-12 0c0 5.7 6 11 6 11Z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
      </button>
      <button class="nav-item" type="button" id="cameraNavBtn" aria-label="위험 구간 제보">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8h4l1.5-2h5L16 8h4v11H4Z" />
          <circle cx="12" cy="13.5" r="3.5" />
        </svg>
      </button>
      <button class="nav-item" type="button" id="bookmarkNavBtn" aria-label="즐겨찾기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4h12v17l-6-3.5L6 21Z" />
        </svg>
      </button>
      <button class="nav-item" type="button" id="loginNavBtn" aria-label="마이 페이지">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4.5 21a7.5 7.5 0 0 1 15 0" />
        </svg>
      </button>
    </nav>
  </div>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=80e48dd01aae3f043d16e5ad41071f5d&libraries=services"></script>
  <script src="script.js?v=20260830-weather-cloud"></script>
</body>
</html>
